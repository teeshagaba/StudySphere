services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: studyos
      POSTGRES_PASSWORD: studyos
      POSTGRES_DB: studyos
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://studyos:studyos@postgres:5432/studyos
      REDIS_URL: redis://redis:6379/0
    depends_on: [postgres, redis]
    ports: ["8000:8000"]

  frontend:
    build:
      context: ./frontend
      args:
        API_URL: http://backend:8000
    depends_on: [backend]
    ports: ["3000:3000"]

volumes:
  pgdata:
