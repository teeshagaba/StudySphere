services:
  - type: web
    name: studysphere-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: studysphere-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JUDGE0_URL
        value: https://ce.judge0.com
      - key: CORS_ORIGINS
        value: '["https://studysphere-web.onrender.com"]'
      # Optional: fill in the dashboard for full AI features (e.g. Groq). Leave empty for offline mode.
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false

  - type: web
    name: studysphere-web
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    envVars:
      # Used at build time for the /api proxy. Must match the backend's public URL.
      - key: API_URL
        value: https://studysphere-api-bjzc.onrender.com

databases:
  - name: studysphere-db
    plan: free
    region: singapore
    databaseName: studysphere
    user: studysphere
